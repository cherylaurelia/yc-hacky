<!doctype html>
<meta charset="utf-8">
<title>Coworker PTT test</title>
<style>
  body { font: 13px -apple-system, sans-serif; margin: 12px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #1b1b1b; color: #eee; } }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #status { font-size: 20px; font-weight: 600; margin: 8px 0; }
  #status.down { color: #d33; }
  pre { margin: 8px 0 0; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
  button { margin-right: 6px; }
</style>
<h1>Coworker PTT test</h1>
<div id="status">fn: up</div>
<div>
  <button onclick="post('speaking')">state: speaking</button>
  <button onclick="post('thinking')">state: thinking</button>
  <button onclick="post('idle')">state: idle</button>
  <button onclick="post('speaking', {agent: 'reviewer', text: 'CI is red on main. Want me to revert the last merge?'})">alert</button>
  <button onclick="post(undefined, null)">clear alert</button>
</div>
<pre id="log"></pre>
<script>
  // Every line also hits /log?... on the dev server, so `python3 -m http.server` prints it to its console.
  const logEl = document.getElementById('log');
  function log(msg) {
    const line = new Date().toISOString().slice(11, 23) + '  ' + msg;
    logEl.textContent = line + '\n' + logEl.textContent;
    fetch('/log?' + encodeURIComponent(msg)).catch(() => {});
  }

  window.addEventListener('coworker-ptt', (e) => {
    const d = e.detail || {};
    document.getElementById('status').textContent = 'fn: ' + (d.down ? 'DOWN' : 'up');
    document.getElementById('status').className = d.down ? 'down' : '';
    log('coworker-ptt ' + JSON.stringify(d));
  });

  // post(state), post(state, {agent, text}) for an alert, post(state, null) to clear the alert.
  function post(state, alert) {
    const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.coworker;
    if (!h) return log('no webkit message handler (not inside Terminal 1.app)');
    const msg = {};
    if (state) msg.state = state;
    if (alert !== undefined) msg.alert = alert;
    h.postMessage(msg);
    log('posted ' + JSON.stringify(msg));
  }

  // ?demo=1 walks the page states and one alert on a timer, for scripted checks of the menu-bar icon and the pill.
  if (new URLSearchParams(location.search).has('demo')) {
    const alert = { agent: 'reviewer', text: 'CI is red on main. Want me to revert the last merge?' };
    [[3, 'thinking'], [6, 'speaking'], [9, 'idle'], [12, 'speaking', alert], [15, 'idle'], [20, undefined, null]]
      .forEach(([t, state, a]) => setTimeout(() => post(state, a), t * 1000));
  }

  // Page keeps running while the panel is hidden? Heartbeat + visibility prove it.
  let beats = 0;
  setInterval(() => log('heartbeat ' + (++beats) + ' visibility=' + document.visibilityState), 1000);
  document.addEventListener('visibilitychange', () => log('visibilitychange -> ' + document.visibilityState));

  // Mic request, as the real page does (no user gesture).
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then((s) => log('mic OK: ' + s.getAudioTracks()[0].label))
    .catch((err) => log('mic FAILED: ' + err.name + ' ' + err.message));
  // Audio without a click: the real page never gets one when you only use fn.
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  log('AudioContext state at load: ' + ctx.state);
  const tone = ctx.createOscillator(); const gain = ctx.createGain(); gain.gain.value = 0.0001;
  tone.connect(gain).connect(ctx.destination); tone.start();
  const wav = 'data:audio/wav;base64,UklGRqQ+AABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YYA+AACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC
