<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coworker popup demo</title>
<style>
  /* Demo stage only: a fake Chrome toolbar with the popup hanging off the extension icon. Not part of the extension. */
  body { margin: 0; min-height: 100vh; background: #e9e6e1; font: 13px system-ui, sans-serif; color: #3b3833; }
  .bar { height: 40px; background: #f7f5f2; border-bottom: 1px solid #d8d3cb; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .url { flex: 1; height: 26px; border-radius: 13px; background: #ebe7e1; display: flex; align-items: center; padding: 0 12px; color: #77716a; }
  .ext { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #0d1117; color: #4493f8; font-weight: 700; box-shadow: 0 0 0 1px #30363d; }
  .stage { display: flex; justify-content: flex-end; padding: 6px 12px; }
  iframe { width: 360px; height: 540px; border: 0; border-radius: 10px; box-shadow: 0 12px 40px #0004, 0 0 0 1px #0002; background: #0d1117; }
  .note { position: fixed; left: 16px; bottom: 14px; max-width: 340px; color: #77716a; line-height: 1.45; }
  @media (max-width: 420px) { .stage { justify-content: center; } .note { display: none; } }
</style>
</head>
<body>
  <div class="bar"><div class="url">github.com/cherylaurelia/yc-hacky/issues/1</div><div class="ext" title="Coworker">◉</div></div>
  <div class="stage"><iframe src="popup.html" title="Coworker popup"></iframe></div>
  <p class="note">Demo with made-up board posts. Try Allow/Deny, open a post, type a question, or hold the mic (or Space).</p>
</body>
</html>
