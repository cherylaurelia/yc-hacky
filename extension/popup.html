<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coworker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <button class="back" id="back" aria-label="Back to the queue" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="title">
        <div class="name"><span class="live" aria-hidden="true"></span><span id="title">Coworker</span></div>
        <div class="sub" id="sub">yc-hacky · board #1</div>
      </div>
      <div class="seg" id="seg" role="tablist" aria-label="Filter">
        <button role="tab" data-filter="all" aria-selected="true">All</button>
        <button role="tab" data-filter="mine" aria-selected="false">Mine</button>
      </div>
    </header>

    <main class="body" id="body"></main>

    <footer class="composer" id="composer">
      <form class="field" id="form" autocomplete="off">
        <input id="input" type="text" placeholder="Ask the board, or reply…" aria-label="Message">
        <div class="listening" id="listening" aria-live="polite" hidden>
          <div class="bars" id="bars" aria-hidden="true"></div>
          <span id="listenText">Listening · release to send</span>
        </div>
      </form>
      <button class="mic" id="mic" type="button" aria-label="Hold to talk" title="Hold to talk (or hold Space)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
